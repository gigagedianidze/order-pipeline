syntax = "proto3";

package order.v1;

option go_package = "github.com/gigagedianidze/order-pipeline/internal/gen/orderv1;orderv1";

import "google/protobuf/timestamp.proto";

// OrderService is the read side of the system. Writes never come through here:
// they go POST /orders -> Kafka -> worker -> Postgres, asynchronously. This
// service exists because reads have genuinely different requirements from
// writes — synchronous, low latency, no durability concerns — and separating
// them is what makes the async write path acceptable.
service OrderService {
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
}

message Item {
  string sku = 1;
  int32 quantity = 2;
  int64 unit_price_cents = 3;
}

message Order {
  string order_id = 1;
  // The delivery that produced this row. Exposed because it is the key a client
  // needs when reconciling against the dead-letter queue.
  string event_id = 2;
  string customer_id = 3;
  repeated Item items = 4;
  int64 total_cents = 5;
  // When the order was accepted by the API.
  google.protobuf.Timestamp occurred_at = 6;
  // When the worker persisted it. The gap between the two is the pipeline's
  // end-to-end latency, and having both makes it measurable from the data alone.
  google.protobuf.Timestamp processed_at = 7;
}

message GetOrderRequest {
  string order_id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message ListOrdersRequest {
  // Server clamps this to a sane range; 0 means "use the default".
  int32 page_size = 1;
  // Opaque cursor from a previous response. Not an offset — see DECISIONS.md.
  string page_token = 2;
  // Optional filter.
  string customer_id = 3;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  // Empty when there are no further pages.
  string next_page_token = 2;
}
