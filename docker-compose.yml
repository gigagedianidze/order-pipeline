# Single-node Kafka (KRaft, no ZooKeeper) + PostgreSQL 16.
# Deliberately one broker, replication factor 1: this is a local lab, not a cluster.
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: edp-kafka
    ports:
      - "9092:9092"          # host -> broker (PLAINTEXT_HOST listener)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      # Two listeners on purpose: containers reach the broker as kafka:19092,
      # processes on the Windows host reach it as localhost:9092. Getting this
      # wrong is the classic "connects, then hangs forever" Kafka-in-Docker trap.
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  # Runs once, creates the topics, exits. Auto-create is off so partition
  # counts are explicit and reproducible.
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: edp-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # A single-element list: compose would otherwise shell-split a plain
    # string and hand `sh -c` only the first word.
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic orders --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic orders.dlq --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --describe

  postgres:
    image: postgres:16-alpine
    container_name: edp-postgres
    ports:
      - "5433:5432"   # 5433 on the host: a native PostgreSQL service already owns 5432 here
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      args:
        SERVICE: api
    container_name: edp-api
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: kafka:19092
      API_ADDR: ":8080"
      QUERY_GRPC_ADDR: query:9090
      METRICS_ADDR: ":2112"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  query:
    build:
      context: .
      args:
        SERVICE: query
    container_name: edp-query
    ports:
      - "9090:9090"
    environment:
      POSTGRES_DSN: postgres://orders:orders@postgres:5432/orders?sslmode=disable
      QUERY_LISTEN_ADDR: ":9090"
      METRICS_ADDR: ":2112"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        SERVICE: worker
    # No container_name: it must stay scalable with `--scale worker=N`.
    environment:
      KAFKA_BROKERS: kafka:19092
      POSTGRES_DSN: postgres://orders:orders@postgres:5432/orders?sslmode=disable
      METRICS_ADDR: ":2112"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    # Compose's default is 10s from SIGTERM to SIGKILL. The worker's own drain
    # deadline is 15s, so the grace period must exceed it or a slow drain is
    # killed by the orchestrator rather than finishing.
    stop_grace_period: 30s
    restart: unless-stopped

  # Reports consumer-group lag by asking the broker directly.
  #
  # The workers export a consumer_lag gauge too, and that is not enough on its
  # own: they are the only source of it, so when every worker dies the series
  # goes stale at its last value and the dashboard shows a healthy 0 while the
  # backlog grows. Measured — see FINDINGS.md. Lag has to be observed by
  # something that is not the thing being observed.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: edp-kafka-exporter
    command:
      - --kafka.server=kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Exposes a read-only slice of the Docker API so Prometheus can discover
  # containers without being handed the daemon socket.
  #
  # Mounting the socket into Prometheus directly, even :ro, would be security
  # theatre: the read-only flag applies to the socket *file*, not to the API
  # behind it, so anything that can reach it can still create a privileged
  # container. This proxy allows GET /containers and nothing else.
  dockerproxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: edp-dockerproxy
    environment:
      CONTAINERS: 1
      # Prometheus reads /networks too, to attach network labels to each target.
      NETWORKS: 1
      # Everything else stays denied, including every write verb.
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: edp-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
    depends_on:
      - dockerproxy
    restart: unless-stopped

volumes:
  kafka-data:
  pg-data:
  prom-data:
